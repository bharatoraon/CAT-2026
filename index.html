const K='catplan1',MK={Done:'\u25cf',Partial:'\u25d0',Missed:'\u2715'};

async function pull(){try{
if(!KEY&&!asked){asked=true;KEY=(prompt('Passphrase to sync your progress (asked once per device):')||'').trim()}
if(!KEY)return;
let r=await api('GET');
if(r.status===401){localStorage.removeItem('catkey');KEY=(prompt('Wrong passphrase. Try again:')||'').trim();if(!KEY)return;r=await api('GET')}
if(!r.ok){if(r.status===401)KEY='';return}

const j=await r.json(),rem=j.s?JSON.parse(j.s):null;
