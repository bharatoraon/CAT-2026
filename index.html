.sc{overflow-x:auto}

.gh-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.gh-months{display:grid;grid-template-columns:repeat(8, 1fr);font-size:11px;color:var(--mu);margin-bottom:6px;padding-left:22px}
.gh-body{display:flex;gap:6px}
.gh-days-lbl{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--mu);line-height:16px;width:16px}
.gh-grid{display:grid;grid-template-columns:repeat(8, 1fr);grid-template-rows:repeat(7, 16px);gap:4px;flex:1}
.gh-cell{width:100%;height:16px;border:1px solid var(--ln);cursor:pointer;position:relative;transition:transform .1s}
.gh-cell:hover{transform:scale(1.2);z-index:2}
.gh-cell.c-empty{opacity:.2;background:transparent}
.gh-cell.c-missed{border-style:dashed;opacity:.55;background:transparent}
.gh-cell.c-missed::after{content:'✕';position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mu)}

.gh-leg-box{width:12px;height:12px;border:1px solid var(--ln);display:inline-block}

.rw-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln);padding:8px 0;font-size:14px}

  });

  // XP calculation
  let xp = (done * 50) + (partial * 25) + (wCount * 20) + (sCount * 30) + (bothCount * 15) + (mockAttempts * 100);
  if(highMockScore>=60) xp += 50;
  if(highMockScore>=75) xp += 100;
  if(curStreak>=3) xp += 50;
  if(curStreak>=7) xp += 150;
  if(curStreak>=14) xp += 350;

  // Level thresholds
  const levels = [
    { lvl: 1, title: 'Foundation Builder', min: 0, max: 250 },
    { lvl: 2, title: 'Backlog Slayer', min: 250, max: 600 },
    { lvl: 3, title: 'Sectional Warrior', min: 600, max: 1200 },
    { lvl: 4, title: '90%ile Contender', min: 1200, max: 2000 },
    { lvl: 5, title: '99%ile Elite', min: 2000, max: 3200 },
    { lvl: 6, title: 'IIM BLACKI Ready', min: 3200, max: 5000 }
  ];
  let curLvl = levels[0];
  for(const l of levels){
    if(xp>=l.min)curLvl=l;
  }
  const lvlProgress = Math.min(100, Math.round(((xp - curLvl.min) / Math.max(1, curLvl.max - curLvl.min)) * 100));

  // Readiness Index (0 - 100%)
  const dayProgress = done / D.days.length;
  const backlogProgress = pc / pr.length;
  const mockProgress = mockAttempts / D.mk.length;
  const readiness = Math.min(100, Math.round((dayProgress * 40) + (backlogProgress * 30) + (mockProgress * 30)));

  return { done, partial, curStreak, maxStreak, pc, prLen: pr.length, xp, curLvl, lvlProgress, readiness, bothCount, mockAttempts, highMockScore };
}

// GitHub Streak Heatmap Component (Monochrome)
function renderGithubGrid(){
  const g = calcStats();
  // 55 days spanning 8 weeks (Mon Oct 6 - Sun Nov 29)
  const cells = [];
  for(let i=0; i<56; i++){
    if(i < D.days.length){
      const day = D.days[i];
      const st = S.d[day.d] || '';
      let cls = 'c-empty';
      if(st === 'Done') cls = 'c-done';
      else if(st === 'Partial') cls = 'c-partial';
      else if(st === 'Missed') cls = 'c-missed';
      
      const title = `${fd(day.d)}: ${st || 'Pending'}${day.t ? ' ['+day.t+']' : ''}`;
      cells.push(`<div class="gh-cell ${cls}" title="${title}" data-a="go" data-i="${i}"></div>`);
    } else {
      cells.push(`<div class="gh-cell c-empty" style="opacity:0.05;cursor:default;"></div>`);
    }
  }

  return `<div class="gh-wrap">
    <div class="gh-header">
      <span>Sprint Activity Heatmap</span>
      <span>${g.curStreak}d Streak 🔥 · ${g.done}/${D.days.length} Days</span>
    </div>
    <div class="gh-months">
      <span>Oct W1</span><span>W2</span><span>W3</span><span>W4</span><span>Nov W5</span><span>W6</span><span>W7</span><span>W8</span>
    </div>
    <div class="gh-body">
      <div class="gh-days-lbl"><span>M</span><span>W</span><span>F</span><span>S</span></div>
      <div class="gh-grid">${cells.join('')}</div>
    </div>
    <div class="gh-legend">
      <span>Less</span>
      <span class="gh-leg-box" style="opacity:.2;"></span>
      <span class="gh-leg-box" style="border-style:dashed;opacity:.55;"></span>
      <span class="gh-leg-box" style="background:var(--mu);opacity:.6;"></span>
      <span class="gh-leg-box" style="background:var(--fg);"></span>
      <span>More (○ Pending · ✕ Missed · ◒ Partial · ● Done)</span>
    </div>
  </div>`;
}

function vToday(){
  const x=D.days[cur],st=S.d[x.d]||'';
  const isEveBeforeStart = td < D.days[0].d && cur === 0;
  const canMark = x.d === td || isEveBeforeStart;
  const r=(l,v)=>v?`<section><h3>${l}</h3><p>${v}</p></section>`:'';
  return `<div class="top"><button data-a="prev">\u2190</button><h2>${fd(x.d)}<small>${x.d===td?'today \u00b7 ':''}${D.ph[x.ph]}</small></h2><button data-a="next">\u2192</button></div>`
  +r('Clear backlog',x.b)+r('Live class',x.l)+r('Practice',x.p)+r('Test',x.t)
  +`<div class="seg">${['Done','Partial','Missed'].map(s=>`<button data-a="st" data-v="${s}" class="${st===s?'on':''}" ${canMark?'':'disabled'}>${s}</button>`).join('')}</div>`
  +`<p class="note" style="margin-top:8px">${x.d<td?'Day closed. Unmarked days become Missed.':(x.d>td && !isEveBeforeStart)?'You can only mark a day on that day.':isEveBeforeStart?'Sprint starts tomorrow (06 Oct). You can mark Day 1.':'Mark Done before midnight, or it becomes Missed.'}</p>`
  +renderGithubGrid();
}

function vPlan(){
  return renderGithubGrid()
  +D.days.map((x,i)=>`<button class="pl" data-a="go" data-i="${i}"><span>${fd(x.d)}</span><span>${MK[S.d[x.d]]||'\u25cb'}</span><span>${x.t||(x.l?x.l.split('.')[0]:'')}</span></button>`).join('');
}

function vBl(){
  return `<p class="note">Tick Watched, then Solved once you finish same-day problems. Tier 3 is optional.</p><div class="sc"><table><tr><th>Class</th><th>Tier</th><th>Plan</th><th>Watched</th><th>Solved</th></tr>`
  +D.bl.map(b=>`<tr class="${S.w[b.r]&&S.s[b.r]?'dn':''}"><td>${b.r}<br>${b.n}</td><td>${b.t.replace('Tier ','')}</td><td>${b.w}</td><td><input type="checkbox" data-a="w" data-r="${b.r}" ${S.w[b.r]?'checked':''}></td><td><input type="checkbox" data-a="s" data-r="${b.r}" ${S.s[b.r]?'checked':''}></td></tr>`).join('')+`</table></div>`;
}

const tot=n=>{const v=(S.m[n]||[]).filter(x=>x!=='').map(Number);return v.length?v.reduce((a,b)=>a+b,0):'-'};
function vMocks(){
  return `<p class="note">Marks per section. Analyse each mock for about twice as long as you took it.</p><div class="sc"><table><tr><th>#</th><th>Date</th><th>VARC</th><th>DILR</th><th>QA</th><th>Total</th></tr>`
  +D.mk.map(m=>`<tr><td>${m.n}</td><td>${m.d}</td>${[0,1,2].map(k=>`<td><input type="number" data-a="m" data-n="${m.n}" data-k="${k}" value="${(S.m[m.n]||[])[k]??''}"></td>`).join('')}<td id="t${m.n}">${tot(m.n)}</td></tr>`).join('')+`</table></div>`;
}

function render(){
  const g = calcStats();
  const left=Math.max(0,Math.ceil((new Date('2026-11-29T00:00:00')-new Date(td+'T00:00:00'))/864e5));
  $('stats').innerHTML=`
    <div><b>${left}</b>days to CAT</div>
    <div><b>${g.curStreak}d 🔥</b>streak</div>
    <div><b>Lv.${g.curLvl.lvl}</b>${g.xp} XP</div>
    <div><b>${g.pc}/${g.prLen}</b>backlog</div>
  `;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('main').innerHTML=({today:vToday,plan:vPlan,bl:vBl,mocks:vMocks,rewards:vRewards,why:vWhy})[view]();
}

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render();window.scrollTo(0,0)}});
$('main').addEventListener('click',e=>{const b=e.target.closest('button[data-a], .gh-cell[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='prev'&&cur>0)cur--;else if(a==='next'&&cur<D.days.length-1)cur++;
else if(a==='go'){cur=+b.dataset.i;view='today';window.scrollTo(0,0)}
else if(a==='st'){const k=D.days[cur].d;const isEveBeforeStart = td < D.days[0].d && cur === 0;if(k!==td && !isEveBeforeStart)return;S.d[k]=S.d[k]===b.dataset.v?'':b.dataset.v;save()}
render()});
$('main').addEventListener('change',e=>{const t=e.target,a=t.dataset.a;
if(a==='w'||a==='s'){S[a][t.dataset.r]=t.checked;save();render()}
else if(a==='rw'){S.rw[t.dataset.id]=t.checked;save();render()}
else if(a==='m'){const n=t.dataset.n;S.m[n]=S.m[n]||['','',''];S.m[n][+t.dataset.k]=t.value;save();$('t'+n).textContent=tot(n);render()}});

render();sync();
